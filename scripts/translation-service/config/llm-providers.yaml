# LLM 提供商配置示例
# 复制为 .env 或环境变量设置

# ============ 国际提供商 ============

# OpenAI (GPT-4 Turbo)
OPENAI_API_KEY=sk-xxxxx
OPENAI_MODEL=gpt-4-turbo-preview
# 模型选项: gpt-4, gpt-4-turbo-preview, gpt-3.5-turbo
# 特点: 质量高，成本中等，响应快

# Anthropic Claude
ANTHROPIC_API_KEY=sk-ant-xxxxx
ANTHROPIC_MODEL=claude-3-sonnet-20240229
# 模型选项: claude-3-opus-20240229, claude-3-sonnet-20240229, claude-3-haiku-20240307
# 特点: 推理能力强，对中文理解好，成本较高

# Google Gemini
GOOGLE_API_KEY=xxxxx
GOOGLE_MODEL=gemini-pro
# 模型选项: gemini-pro, gemini-pro-vision
# 特点: 性价比高，API 简单，多模态支持

# ============ 国产大模型 ============

# 智谱 ChatGLM (推荐中文)
ZHIPU_API_KEY=xxxxx
ZHIPU_MODEL=glm-4
# 模型选项: glm-4, glm-3-turbo
# 特点: 中文优化，成本低，对中国文化理解好

# 百度文心一言
BAIDU_API_KEY=xxxxx
BAIDU_SECRET_KEY=xxxxx
BAIDU_MODEL=ernie-4.0
# 模型选项: ernie-4.0, ernie-3.5, ernie-bot-turbo
# 特点: 对话能力强，有免费额度

# 阿里通义千问
ALI_API_KEY=xxxxx
ALI_MODEL=qwen-turbo
# 模型选项: qwen-turbo, qwen-plus, qwen-max
# 特点: 阿里生态集成，价格便宜

# 腾讯混元
TENCENT_API_KEY=xxxxx
TENCENT_SECRET_KEY=xxxxx
TENCENT_MODEL=hunyuan-lite
# 模型选项: hunyuan-lite, hunyuan-standard, hunyuan-pro
# 特点: 腾讯云集成，中文优化

# 月之暗面 Kimi (长文本)
MOONSHOT_API_KEY=xxxxx
MOONSHOT_MODEL=moonshot-v1-8k
# 模型选项: moonshot-v1-8k, moonshot-v1-32k, moonshot-v1-128k
# 特点: 超长上下文，适合大批量翻译

# ============ 其他选项 ============

# Cohere
COHERE_API_KEY=xxxxx
COHERE_MODEL=command
# 特点: 专注于翻译任务

# ============ 推荐配置 ============

# 🚀 性能最佳组合
# 翻译提供商: DeepL
# 质量校核: OpenAI GPT-4 + Anthropic Claude (双校核)

# 💰 成本最优组合
# 翻译提供商: DeepL
# 质量校核: 智谱 ChatGLM + 百度文心一言 (负载均衡)

# 🇨🇳 中文最优组合
# 翻译提供商: DeepL
# 质量校核: 智谱 ChatGLM (中文优化)

# 🌐 多语言最优组合
# 翻译提供商: DeepL
# 质量校核: Anthropic Claude (对多语言理解好)

# 🔄 负载均衡组合
# 使用多个提供商轮询，提高稳定性
PROVIDERS_ROUND_ROBIN=openai,zhipu,baidu
