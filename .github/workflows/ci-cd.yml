name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ==============================================================================
  # Code Quality Checks
  # ==============================================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort mypy bandit safety

      - name: Run Black (code formatter)
        run: |
          black --check --diff apps/api/app/
          black --check --diff apps/api/tests/

      - name: Run isort (import sorter)
        run: |
          isort --check-only --diff apps/api/app/
          isort --check-only --diff apps/api/tests/

      - name: Run flake8 (linter)
        run: |
          flake8 apps/api/app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 apps/api/app/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Run pylint
        run: |
          pylint apps/api/app/ --exit-zero --output-format=json > pylint-report.json || true
          pylint apps/api/app/

      - name: Run MyPy (type checker)
        run: |
          mypy apps/api/app/ --ignore-missing-imports --no-strict-optional || true

      - name: Run Bandit (security linter)
        run: |
          bandit -r apps/api/app/ -f json -o bandit-report.json || true
          bandit -r apps/api/app/

      - name: Run Safety (dependency check)
        run: |
          safety check --json --output safety-report.json || true
          safety check

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: |
            bandit-report.json
            safety-report.json
            pylint-report.json

  # ==============================================================================
  # Security Scan
  # ==============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit semgrep

      - name: Run security scan
        run: |
          echo "Running safety check..."
          safety check --json --output safety-report.json || true

          echo "Running bandit security scan..."
          bandit -r apps/api/app/ -f json -o bandit-report.json || true

          echo "Running semgrep scan..."
          semgrep --config=auto apps/api/app/ --json --output=semgrep-report.json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            safety-report.json
            bandit-report.json
            semgrep-report.json

  # ==============================================================================
  # Test Suite
  # ==============================================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: [unit, integration, api]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hdcp
          POSTGRES_PASSWORD: hdcp_password
          POSTGRES_DB: hdcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r apps/api/requirements-test.txt
          pip install pytest-xdist

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U hdcp; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Wait for Redis
        run: |
          until redis-cli -h localhost -p 6379 ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Run database migrations
        run: |
          cd apps/api
          alembic upgrade head || echo "Migrations not available, continuing..."

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://hdcp:hdcp_password@localhost:5432/hdcp_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
        run: |
          cd apps/api
          if [ "${{ matrix.test-type }}" = "unit" ]; then
            pytest tests/test_models.py -v --cov=app.models --cov-report=xml
          elif [ "${{ matrix.test-type }}" = "integration" ]; then
            pytest tests/test_api.py -v -m integration --cov=app.routers --cov-report=xml
          elif [ "${{ matrix.test-type }}" = "api" ]; then
            pytest tests/test_api.py -v -m api --cov=app --cov-report=xml
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: apps/api/coverage.xml
          flags: ${{ matrix.test-type }}
          name: codecov-${{ matrix.test-type }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.test-type }}
          path: apps/api/htmlcov/

  # ==============================================================================
  # Performance Tests
  # ==============================================================================
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hdcp
          POSTGRES_PASSWORD: hdcp_password
          POSTGRES_DB: hdcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r apps/api/requirements-test.txt

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U hdcp; do sleep 2; done
          until redis-cli -h localhost -p 6379 ping; do sleep 2; done

      - name: Run performance tests
        env:
          DATABASE_URL: postgresql+asyncpg://hdcp:hdcp_password@localhost:5432/hdcp_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd apps/api
          pytest tests/test_performance.py -v -m performance --benchmark-json=benchmark.json || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: apps/api/benchmark.json

  # ==============================================================================
  # Build and Package
  # ==============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hdcp-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hdcp-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # Deploy to Staging
  # ==============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.hdcp.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment script here
          # Example: kubectl apply -f k8s/staging/

  # ==============================================================================
  # Deploy to Production
  # ==============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://hdcp.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your deployment script here
          # Example: kubectl apply -f k8s/production/

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke tests here
          # Example: pytest tests/smoke/ -v
