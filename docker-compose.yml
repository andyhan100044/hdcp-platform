version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hdcp-postgres
    environment:
      POSTGRES_DB: hdcp_db
      POSTGRES_USER: hdcp_user
      POSTGRES_PASSWORD: hdcp_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./apps/api/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - hdcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdcp_user -d hdcp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hdcp-redis
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - hdcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migration:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: hdcp-migration
    environment:
      DATABASE_URL: postgresql+asyncpg://hdcp_user:hdcp_password@postgres:5432/hdcp_db
      REDIS_URL: redis://:redis_password@redis:6379/0
    command: ["sh", "-c", "alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hdcp-network
    volumes:
      - ./apps/api:/app
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: hdcp-api
    environment:
      DATABASE_URL: postgresql+asyncpg://hdcp_user:hdcp_password@postgres:5432/hdcp_db
      REDIS_URL: redis://:redis_password@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - hdcp-network
    volumes:
      - ./apps/api:/app
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: hdcp-web
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_GRAPHQL_URL: http://api:8000/graphql
      NEXT_PUBLIC_CMS_URL: http://cms:1337
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - hdcp-network
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  cms:
    build:
      context: ./apps/cms
      dockerfile: Dockerfile
    container_name: hdcp-cms
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: hdcp_db
      DATABASE_USERNAME: hdcp_user
      DATABASE_PASSWORD: hdcp_password
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-in-production}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-your-admin-jwt-secret}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-your-api-token-salt}
      APP_KEYS: ${APP_KEYS:-key1,key2,key3,key4}
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hdcp-network
    volumes:
      - ./apps/cms:/app
      - cms_data:/app/public/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: hdcp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
      - api
      - cms
    networks:
      - hdcp-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: hdcp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - hdcp-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: hdcp-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - hdcp-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_logs:
    driver: local
  cms_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  hdcp-network:
    driver: bridge
